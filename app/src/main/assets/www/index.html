<!DOCTYPE html>

    <link rel="stylesheet" href="style.css">
    <!-- ═══════════════════════════════════════════════════════════════════════
         BACKGROUND PLAYBACK — Page Visibility API complete override
         MUST be placed BEFORE the YouTube IFrame API script.

         When Android WebView transitions to background, Chromium broadcasts
         a visibilitychange event to ALL frames (parent + cross-origin iframes).
         The YouTube IFrame API (loaded in THIS frame) monitors parent-frame
         document.visibilityState and calls player.pauseVideo() the instant it
         sees 'hidden'. By permanently clamping visibilityState to 'visible' and
         surgically removing all visibilitychange listeners before they can be
         registered, we prevent the IFrame API from ever issuing that pause.
    ═══════════════════════════════════════════════════════════════════════ -->
    <script>
    !function () {
        'use strict';
        try {
            /* 1. Always report the document as visible */
            Object.defineProperty(document, 'hidden', {
                configurable: true, enumerable: true,
                get: function () { return false; }
            });
            Object.defineProperty(document, 'visibilityState', {
                configurable: true, enumerable: true,
                get: function () { return 'visible'; }
            });

            /* 2. Save the real addEventListener/removeEventListener BEFORE
                  overriding so our own capture listeners below still work. */
            var _ael = EventTarget.prototype.addEventListener;
            var _rel = EventTarget.prototype.removeEventListener;

            /* 3. Pre-emptively capture & swallow any event dispatched before
                  our prototype override takes effect (belt-and-suspenders). */
            _ael.call(window,   'visibilitychange', function (e) { e.stopImmediatePropagation(); }, true);
            _ael.call(document, 'visibilitychange', function (e) { e.stopImmediatePropagation(); }, true);

            /* 4. Override prototype so EVERY future addEventListener call for
                  'visibilitychange' — including the one inside YouTube's
                  iframe_api.js — is silently dropped. */
            EventTarget.prototype.addEventListener = function (type, fn, opts) {
                if (type === 'visibilitychange') return;
                return _ael.call(this, type, fn, opts);
            };
            EventTarget.prototype.removeEventListener = function (type, fn, opts) {
                if (type === 'visibilitychange') return;
                return _rel.call(this, type, fn, opts);
            };
        } catch (e) { /* ignore — worst case YouTube still works normally */ }
    }();
    </script>
    <!-- YouTube IFrame API -->
    <script src="https://www.youtube.com/iframe_api"></script>
</head>

<body>

    <!-- DYNAMIC BACKGROUND -->
    <canvas id="bgc"></canvas>
    <div class="bg-over"></div>
    <div class="bg-grain"></div>

    <!-- ▌MOBILE BOTTOM NAV ▐ -->
    <nav id="mob-nav">
        <div class="mn-pill" id="mnPill" aria-hidden="true"></div>
        <button class="mn-btn on" data-v="home" onclick="gv('home',this)">
            <svg class="mn-ico" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 8L10 2l8 6V18H13V13H7v5H2V8Z" />
            </svg>
            <span>홈</span>
        </button>
        <button class="mn-btn" data-v="search" onclick="gv('search',this)">
            <svg class="mn-ico" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"
                stroke-linecap="round">
                <circle cx="9" cy="9" r="6" />
                <path d="M13.5 13.5L18 18" />
            </svg>
            <span>검색</span>
        </button>
        <button class="mn-btn" data-v="fav" onclick="gv('fav',this)">
            <svg class="mn-ico" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"
                stroke-linecap="round">
                <path d="M10 16.5S3 12 3 7.5a3.5 3.5 0 0 1 7-1A3.5 3.5 0 0 1 17 7.5C17 12 10 16.5 10 16.5z" />
            </svg>
            <span>즐겨찾기</span>
        </button>
        <button class="mn-btn" data-v="queue" onclick="gv('queue',this)">
            <svg class="mn-ico" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"
                stroke-linecap="round">
                <line x1="3" y1="5" x2="17" y2="5" />
                <line x1="3" y1="10" x2="12" y2="10" />
                <line x1="3" y1="15" x2="15" y2="15" />
            </svg>
            <span>대기열</span>
        </button>
        <button class="mn-btn" data-v="playlists" onclick="gv('playlists',this)">
            <svg class="mn-ico" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"
                stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="2" width="7" height="7" rx="1.5" />
                <rect x="11" y="2" width="7" height="7" rx="1.5" />
                <rect x="2" y="11" width="7" height="7" rx="1.5" />
                <path d="M11 14.5h7M14.5 11v7" />
            </svg>
            <span>플레이리스트</span>
        </button>
    </nav>

    <!-- ▌MAIN CONTENT AREA ▐ -->
    <div id="shell">
        <main id="main">

            <!-- HOME VIEW -->
            <div class="view on" id="v-home">
                <div class="view-inner am-home">
                    <div class="mob-header am-header">
                        <div class="mob-logo am-brandrow">
                            <svg width="18" height="18" viewBox="0 0 28 28" fill="none">
                                <rect x="1.5" y="11" width="3" height="6" rx="1.5" fill="white" />
                                <rect x="6.5" y="7" width="3" height="14" rx="1.5" fill="white" />
                                <rect x="11.5" y="4" width="3" height="20" rx="1.5" fill="white" />
                                <rect x="16.5" y="8" width="3" height="12" rx="1.5" fill="white" />
                                <rect x="21.5" y="12" width="3" height="4" rx="1.5" fill="white" />
                            </svg>
                            <span class="mob-logo-word">SYNC</span>
                        </div>
                        <h2 id="greet-h" class="mob-greet am-title">안녕하세요</h2>
                        <p class="mob-greet-sub am-subtitle">오늘은 어떤 음악을 들을까요?</p>
                    </div>

                    <div class="mob-srch-wrap am-srch">
                        <svg class="srch-ico" width="15" height="15" viewBox="0 0 14 14" fill="none"
                            stroke="rgba(255,255,255,.35)" stroke-width="1.5" stroke-linecap="round">
                            <circle cx="6" cy="6" r="4" />
                            <path d="M9.5 9.5L13 13" />
                        </svg>
                        <input class="srch-inp" id="q-home" type="text" placeholder="YouTube 음악 검색..."
                            oninput="onSuggest(this,'sug-home')"
                            onkeydown="if(event.key==='Enter'){hideSug('sug-home');doSearch(this.value)}"
                            onfocus="if(this.value.trim())onSuggest(this,'sug-home')"
                            onblur="setTimeout(()=>hideSug('sug-home'),200)">
                        <button class="srch-btn" onclick="doSearch(document.getElementById('q-home').value)">검색</button>
                        <div class="sug-drop" id="sug-home"></div>
                    </div>

                    <!-- TOP PICKS — 애플뮤직 "Listen Now" 스타일 히어로 캐러셀 -->
                    <div class="sh am-sh">
                        <h3>오늘의 추천</h3>
                        <span class="sh-more" onclick="loadTopPicks('am-hero-row')">새로고침</span>
                    </div>
                    <div class="am-hero-row" id="am-hero-row">
                        <div class="state" style="padding:40px 16px">
                            <div class="spinner"></div>
                        </div>
                    </div>

                    <!-- RECENTLY PLAYED — 로컬 재생 기록 기반, 기록 없으면 자동 숨김 -->
                    <div class="sh am-sh" id="am-recent-sh" style="display:none">
                        <h3>최근 재생</h3>
                    </div>
                    <div class="hrow am-square-row" id="am-recent-row"></div>

                    <!-- MADE FOR YOU -->
                    <div class="sh am-sh">
                        <h3>나를 위한 믹스</h3>
                        <span class="sh-more" onclick="loadRec(personalizedMadeForYouQuery(),'am-mix-row')">새로고침</span>
                    </div>
                    <div class="hrow am-square-row" id="am-mix-row">
                        <div class="state" style="padding:28px 16px">
                            <div class="spinner"></div>
                        </div>
                    </div>

                    <!-- NEW RELEASES -->
                    <div class="sh am-sh">
                        <h3>신곡 소식</h3>
                        <span class="sh-more"
                            onclick="loadRec('new single official music video 2025','am-new-row')">새로고침</span>
                    </div>
                    <div class="hrow am-square-row" id="am-new-row">
                        <div class="state" style="padding:28px 16px">
                            <div class="spinner"></div>
                        </div>
                    </div>

                    <!-- CHARTS -->
                    <div class="sh am-sh">
                        <h3>지금 인기 차트 🔥</h3>
                        <span class="sh-more" onclick="loadChart('am-chart-row')">새로고침</span>
                    </div>
                    <div class="am-chart-row" id="am-chart-row">
                        <div class="state" style="padding:28px 16px">
                            <div class="spinner"></div>
                        </div>
                    </div>

                    <div style="height:24px"></div>
                </div>
            </div>

            <!-- SEARCH VIEW -->
            <div class="view" id="v-search">
                <div class="view-inner">
                    <div class="mob-header">
                        <h2 class="view-title">검색</h2>
                    </div>
                    <div class="mob-srch-wrap">
                        <svg class="srch-ico" width="15" height="15" viewBox="0 0 14 14" fill="none"
                            stroke="rgba(255,255,255,.35)" stroke-width="1.5" stroke-linecap="round">
                            <circle cx="6" cy="6" r="4" />
                            <path d="M9.5 9.5L13 13" />
                        </svg>
                        <input class="srch-inp" id="q-s" type="text" placeholder="YouTube 음악 검색..."
                            oninput="onSuggest(this,'sug-s')"
                            onkeydown="if(event.key==='Enter'){hideSug('sug-s');doSearch(this.value)}"
                            onfocus="if(this.value.trim())onSuggest(this,'sug-s')"
                            onblur="setTimeout(()=>hideSug('sug-s'),200)">
                        <button class="srch-btn" onclick="doSearch(document.getElementById('q-s').value)">검색</button>
                        <div class="sug-drop" id="sug-s"></div>
                    </div>
                    <div id="s-res">
                        <div class="state">
                            <svg width="40" height="40" viewBox="0 0 44 44" fill="none" stroke="currentColor"
                                stroke-width="1.4" stroke-linecap="round">
                                <circle cx="19" cy="19" r="12" />
                                <path d="M31 31L41 41" />
                            </svg>
                            <h3>음악을 검색하세요</h3>
                            <p>YouTube에서 바로 찾아 재생할 수 있어요</p>
                        </div>
                    </div>
                    <div style="height:24px"></div>
                </div>
            </div>

            <!-- FAVORITES VIEW -->
            <div class="view" id="v-fav">
                <div class="view-inner">
                    <div class="mob-header">
                        <h2 class="view-title">즐겨찾기</h2>
                    </div>
                    <div class="cgrid" id="fav-grid">
                        <div class="state" style="grid-column:1/-1">
                            <svg width="40" height="40" viewBox="0 0 44 44" fill="none" stroke="currentColor"
                                stroke-width="1.4" stroke-linecap="round">
                                <path d="M22 38S6 28 6 18a9 9 0 0 1 16-5.6A9 9 0 0 1 38 18C38 28 22 38 22 38z" />
                            </svg>
                            <h3>즐겨찾기가 비었어요</h3>
                            <p>카드의 ♡ 버튼으로 추가하세요</p>
                        </div>
                    </div>
                    <div style="height:24px"></div>
                </div>
            </div>

            <!-- QUEUE VIEW -->
            <div class="view" id="v-queue">
                <div class="view-inner">
                    <div class="mob-header">
                        <h2 class="view-title">재생 대기열</h2>
                    </div>
                    <div id="q-list">
                        <div class="state">
                            <svg width="40" height="40" viewBox="0 0 44 44" fill="none" stroke="currentColor"
                                stroke-width="1.4" stroke-linecap="round">
                                <path d="M6 11h32M6 22h22M6 33h28" />
                            </svg>
                            <h3>대기열 없음</h3>
                        </div>
                    </div>
                    <div style="height:24px"></div>
                </div>
            </div>

            <!-- PLAYLISTS VIEW -->
            <div class="view" id="v-playlists">
                <div class="view-inner">
                    <div id="pl-list-view">
                        <div class="mob-header">
                            <div style="display:flex;justify-content:space-between;align-items:center">
                                <h2 class="view-title">플레이리스트</h2>
                                <button class="pl-new-btn" onclick="plNewPrompt()">
                                    <svg width="12" height="12" viewBox="0 0 13 13" fill="none" stroke="currentColor"
                                        stroke-width="2" stroke-linecap="round">
                                        <line x1="6.5" y1="1" x2="6.5" y2="12" />
                                        <line x1="1" y1="6.5" x2="12" y2="6.5" />
                                    </svg>
                                    새 플레이리스트
                                </button>
                            </div>
                        </div>
                        <div id="pl-grid"></div>
                    </div>
                    <div id="pl-detail-view" style="display:none">
                        <div class="mob-header">
                            <button class="pl-back-btn" onclick="plShowList()">
                                <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="9,2 4,7 9,12" />
                                </svg>
                                뒤로
                            </button>
                            <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">
                                <button class="sh-more" onclick="plPlayAll()">전체 재생</button>
                                <button class="pl-add-track-btn" onclick="plAddModalOpen()">+ 곡 추가</button>
                                <button class="sh-more" onclick="plRenamePrompt()" style="color:var(--t3)">이름
                                    변경</button>
                                <button class="sh-more" onclick="plDeleteCurrent()" style="color:#ff5f57">삭제</button>
                            </div>
                        </div>
                        <div class="pl-detail-header">
                            <div class="pl-detail-cover" id="pl-detail-cover"></div>
                            <div class="pl-detail-meta">
                                <div class="pl-detail-name" id="pl-detail-name"></div>
                                <div class="pl-detail-count" id="pl-detail-count"></div>
                            </div>
                        </div>
                        <div id="pl-track-list"></div>
                    </div>
                    <div style="height:24px"></div>
                </div>
            </div>

        </main>

        <!-- ▌MINI PLAYER BAR ▐ -->
        <div id="bar" class="bar-hidden">
            <div class="bar-inner">
                <img id="b-art" class="bt-art" src="" alt="" onclick="openNP()">
                <div class="bt-m" onclick="openNP()">
                    <div id="b-title" class="bt-title">—</div>
                    <div id="b-ch" class="bt-ch">재생 중인 곡 없음</div>
                </div>
                <button class="bt-fav" id="b-fav" onclick="favCur()">
                    <svg width="18" height="18" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.5"
                        stroke-linecap="round">
                        <path d="M7.5 12.5S2 8.8 2 5.5a3 3 0 0 1 5.5-1.65A3 3 0 0 1 13 5.5C13 8.8 7.5 12.5 7.5 12.5z" />
                    </svg>
                </button>
                <div class="vizz off" id="vizz">
                    <div class="vb"></div>
                    <div class="vb"></div>
                    <div class="vb"></div>
                    <div class="vb"></div>
                    <div class="vb"></div>
                </div>
                <button class="cb cb-play bar-play" id="cb-play" onclick="togglePlay()" aria-label="Play">
                    <svg viewBox="0 0 512 512" fill="currentColor">
                        <path
                            d="M133 440a35.37 35.37 0 0 1-17.5-4.67c-12-6.8-19.46-20-19.46-34.33V111c0-14.37 7.46-27.53 19.46-34.33a35.13 35.13 0 0 1 35.77.45l247.85 148.36a36 36 0 0 1 0 61l-247.89 148.4A35.5 35.5 0 0 1 133 440" />
                    </svg>
                </button>
                <button class="cb bar-next" onclick="nextT()" aria-label="Next">
                    <svg viewBox="0 0 512 512" class="bar-next-svg">
                        <path
                            d="m30.71 229.47 188.87-113a30.54 30.54 0 0 1 31.09-.39 33.74 33.74 0 0 1 16.76 29.47v79.05l180.72-108.16a30.54 30.54 0 0 1 31.09-.39A33.74 33.74 0 0 1 496 145.52v221A33.73 33.73 0 0 1 479.24 396a30.54 30.54 0 0 1-31.09-.39L267.43 287.4v79.08A33.73 33.73 0 0 1 250.67 396a30.54 30.54 0 0 1-31.09-.39l-188.87-113a31.27 31.27 0 0 1 0-53z" />
                    </svg>
                </button>
            </div>
            <div class="bar-prog">
                <div class="bar-prog-fill" id="bar-prog-fill"></div>
            </div>
        </div>

    </div>

    <!-- ▌NOW PLAYING OVERLAY ▐ -->
    <div id="np">
        <canvas id="np-bg"></canvas>
        <div class="np-grain"></div>
        <div class="np-vignette"></div>
        <canvas id="np-particles"></canvas>

        <button class="np-x" onclick="closeNP()">
            <svg width="13" height="13" viewBox="0 0 13 13" fill="none" stroke="rgba(255,255,255,.8)" stroke-width="1.9"
                stroke-linecap="round">
                <line x1="1.5" y1="1.5" x2="11.5" y2="11.5" />
                <line x1="11.5" y1="1.5" x2="1.5" y2="11.5" />
            </svg>
        </button>

        <button class="np-fs-btn" id="np-fs-btn" onclick="toggleNpFullscreen()">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="rgba(255,255,255,.8)" stroke-width="1.8"
                stroke-linecap="round">
                <path d="M1 6V1h5M10 1h5v5M15 10v5h-5M6 15H1v-5" />
            </svg>
        </button>

        <div class="np-art-area">
            <div class="np-art-shell" id="np-ash">
                <img id="np-art" src="" alt="">
                <div class="np-vinyl-ring" id="np-vinyl"></div>
                <div class="np-art-glow" id="np-art-glow"></div>
                <div class="np-pulse" id="np-pulse"></div>
            </div>
            <div class="np-lyrics-panel" id="np-lyrics-panel">
                <div class="np-lyrics-scroll" id="np-lyrics-scroll">
                    <div class="np-lyrics-inner" id="np-lyrics-inner"></div>
                </div>
                <div class="np-lyrics-fade-top"></div>
                <div class="np-lyrics-fade-bot"></div>
            </div>
        </div>

        <div class="np-panel">
            <div class="np-info-row">
                <div class="np-meta">
                    <div id="np-title" class="np-title">—</div>
                    <div id="np-ch" class="np-ch">—</div>
                </div>
                <button class="np-act" id="np-fav" onclick="favCur()">
                    <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="rgba(255,255,255,.5)"
                        stroke-width="1.5" stroke-linecap="round">
                        <path
                            d="M11 18.5S3 13.5 3 8.5a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 19 8.5C19 13.5 11 18.5 11 18.5z" />
                    </svg>
                </button>
                <button class="np-act" id="np-save" onclick="saveLocalMusic()" title="로컬 저장">
                    <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="rgba(255,255,255,.5)"
                        stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M11 2v9M7 8l4 4 4-4M4 16.5v2a1.5 1.5 0 0 0 1.5 1.5h11A1.5 1.5 0 0 0 18 18.5v-2" />
                    </svg>
                </button>
                <button class="np-act np-lv-btn" id="np-lv-btn" onclick="toggleLyricsView()" title="가사 보기">
                    <svg width="22" height="22" viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg"
                        aria-hidden="true">
                        <path
                            d="M4.3 3.8H14.15C15.4 3.8 16.3 4.7 16.3 5.95v5.9c0 1.25-.9 2.15-2.15 2.15H9.25l-3.2 2.55V14H4.3c-1.25 0-2.15-.9-2.15-2.15v-5.9C2.15 4.7 3.05 3.8 4.3 3.8Z"
                            stroke="currentColor" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round" />
                        <path
                            d="M8.05 8.15c-.53 0-.9.35-.9.83 0 .47.33.76.76.76.21 0 .39-.07.52-.2-.07.46-.31.8-.67 1.02-.14.09-.18.25-.1.38.09.13.25.16.39.08.55-.32.85-.84.85-1.57 0-.8-.32-1.3-.85-1.3Z"
                            fill="currentColor" />
                        <path
                            d="M10.65 8.15c-.53 0-.9.35-.9.83 0 .47.33.76.76.76.21 0 .39-.07.52-.2-.07.46-.31.8-.67 1.02-.14.09-.18.25-.1.38.09.13.25.16.39.08.55-.32.85-.84.85-1.57 0-.8-.32-1.3-.85-1.3Z"
                            fill="currentColor" />
                    </svg>
                </button>
            </div>

            <div class="np-prog-wrap">
                <div class="np-pb" id="np-pb">
                    <div class="np-pf" id="np-pf"></div>
                    <div class="np-pd" id="np-pd"></div>
                </div>
                <div class="np-times">
                    <span class="np-t" id="np-cur">0:00</span>
                    <span class="np-t" id="np-tot">0:00</span>
                </div>
            </div>

            <div class="np-ctrl">
                <button class="nc" id="nc-sh" onclick="toggleShuf()">
                    <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.4"
                        stroke-linecap="round">

    <!-- ▌LIQUID GLASS SVG FILTERS (검색 캡슐 / 하단 내비 캡슐 굴절 맵) ▐ -->
    <svg class="svg-defs" aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden">
        <defs>
            <filter id="liquidGlassSearchFilter" x="-15%" y="-40%" width="130%" height="180%"
                color-interpolation-filters="sRGB" filterUnits="objectBoundingBox" primitiveUnits="userSpaceOnUse">
                <feImage id="searchDisplacementMap" x="0" y="0" width="1" height="1" preserveAspectRatio="none"
                    result="searchMap" />
                <feDisplacementMap id="searchGlassRefraction" in="SourceGraphic" in2="searchMap" scale="1"
                    xChannelSelector="R" yChannelSelector="G" result="searchRefracted" />
                <feGaussianBlur in="searchRefracted" stdDeviation="1" result="searchBlurred" />
                <feBlend in="searchRefracted" in2="searchBlurred" mode="normal" result="searchSoft" />
            </filter>

            <filter id="liquidGlassNavFilter" x="-15%" y="-30%" width="130%" height="160%"
                color-interpolation-filters="sRGB" filterUnits="objectBoundingBox" primitiveUnits="userSpaceOnUse">
                <feImage id="navDisplacementMap" x="0" y="0" width="1" height="1" preserveAspectRatio="none"
                    result="navMap" />
                <feDisplacementMap id="navGlassRefraction" in="SourceGraphic" in2="navMap" scale="1"
                    xChannelSelector="R" yChannelSelector="G" result="navRefracted" />
                <feGaussianBlur in="navRefracted" stdDeviation="1" result="navBlurred" />
                <feBlend in="navRefracted" in2="navBlurred" mode="normal" result="navSoft" />
            </filter>

            <filter id="liquidGlassBarFilter" x="-15%" y="-30%" width="130%" height="160%"
                color-interpolation-filters="sRGB" filterUnits="objectBoundingBox" primitiveUnits="userSpaceOnUse">
                <feImage id="barDisplacementMap" x="0" y="0" width="1" height="1" preserveAspectRatio="none"
                    result="barMap" />
                <feDisplacementMap id="barGlassRefraction" in="SourceGraphic" in2="barMap" scale="1"
                    xChannelSelector="R" yChannelSelector="G" result="barRefracted" />
                <feGaussianBlur in="barRefracted" stdDeviation="1" result="barBlurred" />
                <feBlend in="barRefracted" in2="barBlurred" mode="normal" result="barSoft" />
            </filter>

            <filter id="liquidGlassPillFilter" x="-40%" y="-70%" width="180%" height="240%"
                color-interpolation-filters="sRGB" filterUnits="objectBoundingBox" primitiveUnits="userSpaceOnUse">
                <feImage id="pillDisplacementMap" x="0" y="0" width="1" height="1" preserveAspectRatio="none"
                    result="pillMap" />
                <feDisplacementMap id="pillGlassRefraction" in="SourceGraphic" in2="pillMap" scale="1"
                    xChannelSelector="R" yChannelSelector="G" result="pillRefracted" />
                <feGaussianBlur in="pillRefracted" stdDeviation=".4" result="pillBlurred" />
                <feBlend in="pillRefracted" in2="pillBlurred" mode="normal" result="pillSoft" />
            </filter>

            <!-- 플레이리스트 팝업(박스) UI 전용 Liquid Glass 굴절 필터 4종
                 — 캡슐(pill)과 동일한 수학(refractionProfile/makeMap)을 사각 박스 bezel에 맞춰 재사용 -->
            <filter id="liquidGlassCtxFilter" x="-15%" y="-15%" width="130%" height="130%"
                color-interpolation-filters="sRGB" filterUnits="objectBoundingBox" primitiveUnits="userSpaceOnUse">
                <feImage id="ctxDisplacementMap" x="0" y="0" width="1" height="1" preserveAspectRatio="none"
                    result="ctxMap" />
                <feDisplacementMap id="ctxGlassRefraction" in="SourceGraphic" in2="ctxMap" scale="1"
                    xChannelSelector="R" yChannelSelector="G" result="ctxRefracted" />
                <feGaussianBlur in="ctxRefracted" stdDeviation=".6" result="ctxBlurred" />
                <feBlend in="ctxRefracted" in2="ctxBlurred" mode="normal" result="ctxSoft" />
            </filter>

            <filter id="liquidGlassDialogFilter" x="-12%" y="-12%" width="124%" height="124%"
                color-interpolation-filters="sRGB" filterUnits="objectBoundingBox" primitiveUnits="userSpaceOnUse">
                <feImage id="dialogDisplacementMap" x="0" y="0" width="1" height="1" preserveAspectRatio="none"
                    result="dialogMap" />
                <feDisplacementMap id="dialogGlassRefraction" in="SourceGraphic" in2="dialogMap" scale="1"
                    xChannelSelector="R" yChannelSelector="G" result="dialogRefracted" />
                <feGaussianBlur in="dialogRefracted" stdDeviation=".8" result="dialogBlurred" />
                <feBlend in="dialogRefracted" in2="dialogBlurred" mode="normal" result="dialogSoft" />
            </filter>

            <filter id="liquidGlassConfirmFilter" x="-12%" y="-12%" width="124%" height="124%"
                color-interpolation-filters="sRGB" filterUnits="objectBoundingBox" primitiveUnits="userSpaceOnUse">
                <feImage id="confirmDisplacementMap" x="0" y="0" width="1" height="1" preserveAspectRatio="none"
                    result="confirmMap" />
                <feDisplacementMap id="confirmGlassRefraction" in="SourceGraphic" in2="confirmMap" scale="1"
                    xChannelSelector="R" yChannelSelector="G" result="confirmRefracted" />
                <feGaussianBlur in="confirmRefracted" stdDeviation=".8" result="confirmBlurred" />
                <feBlend in="confirmRefracted" in2="confirmBlurred" mode="normal" result="confirmSoft" />
            </filter>

            <filter id="liquidGlassAddModalFilter" x="-10%" y="-10%" width="120%" height="120%"
                color-interpolation-filters="sRGB" filterUnits="objectBoundingBox" primitiveUnits="userSpaceOnUse">
                <feImage id="addModalDisplacementMap" x="0" y="0" width="1" height="1" preserveAspectRatio="none"
                    result="addModalMap" />
                <feDisplacementMap id="addModalGlassRefraction" in="SourceGraphic" in2="addModalMap" scale="1"
                    xChannelSelector="R" yChannelSelector="G" result="addModalRefracted" />
                <feGaussianBlur in="addModalRefracted" stdDeviation=".8" result="addModalBlurred" />
                <feBlend in="addModalRefracted" in2="addModalBlurred" mode="normal" result="addModalSoft" />
            </filter>
        </defs>
    </svg>

    <script src="liquid-glass.js"></script>

    <!-- AndroidBridge 준비 후 홈 화면(애플뮤직 스타일) 로드 -->
    <script>
        (function waitBridge() {
            // AndroidBridge는 WebView가 완전히 로드된 후 주입됨
            // app.js의 initYt()가 이미 YT API를 <head>에서 로드했으므로
            // 브릿지만 준비되면 initAmHome 호출 가능
            function tryLoad() {
                if (typeof window.AndroidBridge !== 'undefined' &&
                    typeof window.initAmHome === 'function') {
                    initAmHome();
                } else {
                    setTimeout(tryLoad, 150);
                }
            }
            tryLoad();
        })();
    </script>
